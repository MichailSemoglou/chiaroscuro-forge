name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install black==25.11.0 flake8
      - name: Check formatting
        run: black --check --line-length 100 chiaroscuro_forge/ tests/
      - name: Lint
        run: flake8 chiaroscuro_forge/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -q --no-cov --ignore=tests/test_property_based.py --ignore=tests/test_gpu.py -k "not test_tiling"

  test-full:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full suite with coverage
        run: |
          pytest tests/ -v --cov=chiaroscuro_forge --cov-report=term --cov-fail-under=64 --ignore=tests/test_gpu.py

  security:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,perceptual]" pip-audit

      - name: Audit dependencies
        run: pip-audit
