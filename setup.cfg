[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .venv,
    venv,
    chiaroscuro_forge.py
max-complexity = 15
docstring-convention = numpy

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = chiaroscuro_forge\.py$

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=chiaroscuro_forge
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=64
